[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseforge"
version = "1.0.0"
description = "Zero-dependency base-encoding toolkit: Base16/32/58/62/64/85 plus a random short-id generator (pure Python stdlib)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["base58", "base62", "base64", "base32", "base16", "base85", "encoding", "shortid", "zero-dependency"]
authors = [{ name = "gitstq" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gitstq/BaseForge"
Repository = "https://github.com/gitstq/BaseForge"
Issues = "https://github.com/gitstq/BaseForge/issues"

[project.scripts]
baseforge = "baseforge.__main__:main"

[tool.setuptools]
packages = ["baseforge"]
